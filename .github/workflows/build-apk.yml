name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same debug signing key on every build, so new APKs can be installed over old ones.
      # (This is a throw-away debug key with the standard password "android", not a secret.)
      - name: Restore debug keystore
        run: echo "" | base64 -d > debug.keystore

      # The app's AI part used Firebase, which is not set up in this repo.
      # This step makes the app call the Gemini API directly with your own free API key.
      # The key comes from the GitHub secret GEMINI_API_KEY.
      - name: Use Gemini API key for AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIR=app/src/main/java/com/example/data
          KEY=$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]"\\$')
          if [ -z "$KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing. Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          printf 'package com.example.data\n\nobject ApiKeys {\n    val GEMINI: String = "%s"\n}\n' "$KEY" > "$DIR/ApiKeys.kt"
          cat > "$DIR/ShaderAiRepository.kt" <<'KOTLIN_EOF'
          package com.example.data

          import com.example.model.ShaderCategory
          import com.example.model.ShaderPreset
          import com.example.model.TargetPlatform
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.SocketTimeoutException
          import java.net.URL

          /**
           * Calls the Gemini API directly with an API key, so no Firebase project is needed.
           * The key is written into ApiKeys.kt by the GitHub workflow at build time.
           */
          class ShaderAiRepository {

              private fun numberField(description: String): JSONObject =
                  JSONObject().put("type", "NUMBER").put("description", description)

              private fun stringField(description: String): JSONObject =
                  JSONObject().put("type", "STRING").put("description", description)

              private fun enumField(values: List<String>, description: String): JSONObject =
                  JSONObject()
                      .put("type", "STRING")
                      .put("format", "enum")
                      .put("enum", JSONArray(values))
                      .put("description", description)

              private val shaderSchema: JSONObject by lazy {
                  val fields = linkedMapOf(
                      "title" to stringField("Short creative title for the generated shader (max 60 chars)"),
                      "presetCategory" to enumField(
                          ShaderCategory.entries.map { it.name },
                          "Best matching shader category"
                      ),
                      "targetPlatform" to enumField(
                          TargetPlatform.entries.map { it.name },
                          "Best target pack format"
                      ),
                      "summary" to stringField("Concise 1-2 sentence technical breakdown of lighting, water, and GI effects"),
                      "sunWarmth" to numberField("Sun color warmth between 0.0 and 2.0"),
                      "sunElevation" to numberField("Sun elevation between -0.5 (night) and 1.5 (noon)"),
                      "fogDensity" to numberField("Atmospheric fog density between 0.0 and 2.0"),
                      "godRaysIntensity" to numberField("Volumetric sun shaft intensity between 0.0 and 2.0"),
                      "waterReflectivity" to numberField("Fresnel water reflection multiplier between 0.0 and 1.5"),
                      "giBounceIntensity" to numberField("Ray-traced style indirect GI bounce between 0.0 and 2.0"),
                      "bloomIntensity" to numberField("Emissive and highlight bloom between 0.0 and 2.0"),
                      "saturation" to numberField("Final color grading saturation between 0.0 and 2.5"),
                      "exposure" to numberField("Filmic tone-mapping exposure between 0.2 and 3.0"),
                      "shadowSoftness" to numberField("Penumbra shadow softness between 0.0 and 2.0"),
                      "pbrMetallicBoost" to numberField("Specular PBR metallic intensity between 0.0 and 2.0"),
                      "skyZenithHex" to stringField("6-digit hex color with # prefix for upper sky, e.g. #14357A"),
                      "skyHorizonHex" to stringField("6-digit hex color with # prefix for horizon sky, e.g. #FF9E59"),
                      "sunLightHex" to stringField("6-digit hex color with # prefix for direct sun/moon light"),
                      "ambientTintHex" to stringField("6-digit hex color with # prefix for ambient shadow fill"),
                      "waterTintHex" to stringField("6-digit hex color with # prefix for water absorption color"),
                      "fogTintHex" to stringField("6-digit hex color with # prefix for distance fog color"),
                      "fragmentShader" to stringField(
                          "Complete valid OpenGL ES 1.00 GLSL fragment shader (max 12000 chars) rendering a 3D ray-marched voxel landscape, reflective water, sky, clouds, and lighting using the provided uniforms."
                      )
                  )
                  val properties = JSONObject()
                  val required = JSONArray()
                  for ((name, schema) in fields) {
                      properties.put(name, schema)
                      required.put(name)
                  }
                  JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", properties)
                      .put("required", required)
              }

              private val systemPrompt: String = """
                  You are Lumina Shader Forge, an expert graphics programmer specializing in Minecraft Vibrant Visuals PBR, RTX-style ray-traced lighting, and mobile OpenGL ES GLSL shaders.
                  Given a user's prompt (in English or Bengali/Banglish), synthesize a complete, cohesive shader configuration AND valid OpenGL ES 1.00 fragment shader (`fragmentShader`).

                  CRITICAL GLSL RULES FOR `fragmentShader`:
                  1. Start with `precision mediump float;`
                  2. Use GLSL ES 1.00 syntax (`gl_FragColor = vec4(...);`, NO `out vec4`, NO `texture()`, NO bitwise ops).
                  3. Declare and use these exact uniforms so the app's real-time controls and drag-to-orbit camera work seamlessly:
                     uniform vec2 uResolution;
                     uniform float uTime;
                     uniform float uYaw;
                     uniform float uPitch;
                     uniform float uSunWarmth;
                     uniform float uSunElevation;
                     uniform float uFogDensity;
                     uniform float uGodRaysIntensity;
                     uniform float uWaterReflectivity;
                     uniform float uGiBounceIntensity;
                     uniform float uBloomIntensity;
                     uniform float uSaturation;
                     uniform float uExposure;
                     uniform float uShadowSoftness;
                     uniform float uPbrMetallicBoost;
                     uniform vec3 uSkyZenith;
                     uniform vec3 uSkyHorizon;
                     uniform vec3 uSunLight;
                     uniform vec3 uAmbientTint;
                     uniform vec3 uWaterTint;
                     uniform vec3 uFogTint;
                  4. Every float literal MUST have a decimal point (e.g., `1.0`, `0.0`, `3.0`). Never write `vec3(1)` or `float x = 0;`.
                  5. All `for` loops MUST have constant integer bounds <= 42 (e.g., `for (int i = 0; i < 36; i++)`).
                  6. Render a visually rich 3D ray-marched voxel terrain + reflective water plane + sky + volumetric sun shafts/aurora/glowing ores matching the prompt.
                  7. Hex colors MUST strictly be 7 characters (`#RRGGBB`).
              """.trimIndent()

              suspend fun generateShader(
                  userPrompt: String,
                  targetPlatform: TargetPlatform,
                  existingShader: ShaderPreset? = null
              ): ShaderPreset {
                  val apiKey = ApiKeys.GEMINI
                  if (apiKey.isBlank()) {
                      throw IllegalStateException(
                          "Gemini API key is missing. Add the GEMINI_API_KEY secret in GitHub and build again."
                      )
                  }

                  val fullPrompt = buildString {
                      appendLine("Target export platform: ${targetPlatform.label} (${targetPlatform.name}).")
                      if (existingShader != null) {
                          appendLine("Refine this existing shader preset based on the user's request:")
                          appendLine("Current title: ${existingShader.title}")
                          appendLine("Current summary: ${existingShader.summary}")
                          appendLine(
                              "Current params: sunWarmth=${existingShader.sunWarmth}, sunElevation=${existingShader.sunElevation}, " +
                                  "fogDensity=${existingShader.fogDensity}, godRays=${existingShader.godRaysIntensity}, " +
                                  "waterReflectivity=${existingShader.waterReflectivity}, giBounce=${existingShader.giBounceIntensity}, " +
                                  "bloom=${existingShader.bloomIntensity}, saturation=${existingShader.saturation}, " +
                                  "exposure=${existingShader.exposure}, pbrMetallic=${existingShader.pbrMetallicBoost}."
                          )
                      }
                      appendLine("User prompt: $userPrompt")
                      appendLine("Also make sure the generated GLSL fragmentShader is self-contained, fast on mobile GPUs, and visually dramatic.")
                  }

                  val rawJson = withContext(Dispatchers.IO) { callGemini(apiKey, fullPrompt) }
                  if (rawJson.isBlank()) {
                      throw IllegalStateException("Gemini returned an empty shader response.")
                  }

                  val json = try {
                      JSONObject(rawJson)
                  } catch (e: Exception) {
                      throw IllegalStateException("The AI answer was cut off or invalid. Please try again.")
                  }

                  val generatedCode = json.optString("fragmentShader").trim()
                  val safeCode = if (generatedCode.contains("gl_FragColor") && generatedCode.contains("main")) {
                      generatedCode
                  } else {
                      ShaderDefaults.BASE_VOXEL_FRAGMENT_SHADER
                  }

                  return ShaderPreset(
                      id = existingShader?.id.orEmpty(),
                      title = json.optString("title", "Forged Shader").take(80),
                      prompt = userPrompt.take(600),
                      presetCategory = ShaderCategory.fromRaw(json.optString("presetCategory")).name,
                      targetPlatform = targetPlatform.name,
                      summary = json.optString("summary", "AI-synthesized volumetric & PBR shader.").take(500),
                      fragmentShader = safeCode.take(15000),
                      sunWarmth = json.optDouble("sunWarmth", 1.2).coerceIn(0.0, 2.0),
                      sunElevation = json.optDouble("sunElevation", 0.35).coerceIn(-0.5, 1.5),
                      fogDensity = json.optDouble("fogDensity", 0.45).coerceIn(0.0, 2.0),
                      godRaysIntensity = json.optDouble("godRaysIntensity", 1.1).coerceIn(0.0, 2.0),
                      waterReflectivity = json.optDouble("waterReflectivity", 1.0).coerceIn(0.0, 1.5),
                      giBounceIntensity = json.optDouble("giBounceIntensity", 1.1).coerceIn(0.0, 2.0),
                      bloomIntensity = json.optDouble("bloomIntensity", 0.9).coerceIn(0.0, 2.0),
                      saturation = json.optDouble("saturation", 1.25).coerceIn(0.0, 2.5),
                      exposure = json.optDouble("exposure", 1.15).coerceIn(0.2, 3.0),
                      shadowSoftness = json.optDouble("shadowSoftness", 0.8).coerceIn(0.0, 2.0),
                      pbrMetallicBoost = json.optDouble("pbrMetallicBoost", 1.0).coerceIn(0.0, 2.0),
                      skyZenithHex = ShaderPreset.normalizeHex(json.optString("skyZenithHex"), "#15306B"),
                      skyHorizonHex = ShaderPreset.normalizeHex(json.optString("skyHorizonHex"), "#FFA25C"),
                      sunLightHex = ShaderPreset.normalizeHex(json.optString("sunLightHex"), "#FFD68A"),
                      ambientTintHex = ShaderPreset.normalizeHex(json.optString("ambientTintHex"), "#3A5894"),
                      waterTintHex = ShaderPreset.normalizeHex(json.optString("waterTintHex"), "#1B748F"),
                      fogTintHex = ShaderPreset.normalizeHex(json.optString("fogTintHex"), "#E8AD82"),
                      favorite = existingShader?.favorite ?: false,
                      createdAtMillis = existingShader?.createdAtMillis ?: 0L,
                      updatedAtMillis = existingShader?.updatedAtMillis ?: 0L
                  )
              }

              /** Blocking HTTP call. Always run on Dispatchers.IO. Returns the model's JSON text. */
              private fun callGemini(apiKey: String, prompt: String): String {
                  val body = JSONObject()
                      .put(
                          "systemInstruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", systemPrompt)))
                      )
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject()
                                  .put("role", "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          )
                      )
                      .put(
                          "generationConfig",
                          JSONObject()
                              .put("responseMimeType", "application/json")
                              .put("responseSchema", shaderSchema)
                      )

                  val connection = URL(ENDPOINT).openConnection() as HttpURLConnection
                  val result: String = try {
                      connection.requestMethod = "POST"
                      connection.connectTimeout = 20_000
                      connection.readTimeout = 120_000
                      connection.doOutput = true
                      connection.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      connection.setRequestProperty("x-goog-api-key", apiKey)
                      connection.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = connection.responseCode
                      val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                      val responseText = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }.orEmpty()
                      if (code !in 200..299) {
                          throw IllegalStateException(friendlyError(code, responseText))
                      }
                      extractText(responseText)
                  } catch (e: SocketTimeoutException) {
                      throw IllegalStateException("The AI took too long. Try a shorter prompt or try again.")
                  } catch (e: IOException) {
                      throw IllegalStateException("Could not reach Gemini. Check your internet and try again.")
                  } finally {
                      connection.disconnect()
                  }
                  return result
              }

              private fun extractText(responseJson: String): String {
                  val root = JSONObject(responseJson)
                  val candidates = root.optJSONArray("candidates")
                  if (candidates == null || candidates.length() == 0) {
                      val reason = root.optJSONObject("promptFeedback")?.optString("blockReason").orEmpty()
                      throw IllegalStateException(
                          if (reason.isNotBlank()) {
                              "Gemini blocked this prompt ($reason). Try different words."
                          } else {
                              "Gemini returned no answer. Please try again."
                          }
                      )
                  }
                  val parts = candidates.getJSONObject(0).optJSONObject("content")?.optJSONArray("parts")
                  val text = StringBuilder()
                  if (parts != null) {
                      for (i in 0 until parts.length()) {
                          val part = parts.getJSONObject(i)
                          if (part.optBoolean("thought", false)) continue
                          text.append(part.optString("text", ""))
                      }
                  }
                  return text.toString()
              }

              private fun friendlyError(code: Int, body: String): String {
                  val apiMessage = try {
                      JSONObject(body).optJSONObject("error")?.optString("message").orEmpty()
                  } catch (e: Exception) {
                      ""
                  }
                  val hint = when (code) {
                      400 -> "Request rejected - check that the API key is correct."
                      401, 403 -> "The API key was not accepted."
                      429 -> "Free quota used up or too many requests. Wait a minute and try again."
                      500, 502, 503, 504 -> "Gemini is busy right now. Try again."
                      else -> ""
                  }
                  return "Gemini error $code. $hint ${apiMessage.take(200)}".trim()
              }

              companion object {
                  private const val MODEL = "gemini-3.8-flash"
                  private const val ENDPOINT =
                      "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent"
              }
          }
          KOTLIN_EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-shader-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
